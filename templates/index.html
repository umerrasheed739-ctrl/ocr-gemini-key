<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 1 - OCR Document Processing Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shadow-sm">
        <div>
            <h1 class="text-xl font-bold text-slate-900">Enterprise OCR Engine</h1>
            <p class="text-xs text-slate-500">Phase 1: Flask + Gemini Vision Pipeline</p>
        </div>

        <form id="uploadForm" class="flex items-center gap-3">
            <input type="file" id="documentInput" name="document" accept="image/*" class="hidden" onchange="submitUpload()">
            <label for="documentInput" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-lg cursor-pointer transition shadow-sm text-sm">
                📁 Upload Document Button
            </label>
        </form>
    </header>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Left Column: Form + Edit + Save -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col">
            <h2 class="text-lg font-semibold text-slate-800 mb-4 pb-2 border-b border-slate-100">
                Extracted Information (JSON Auto-Fill)
            </h2>

            <div id="loadingState" class="hidden my-12 text-center">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
                <p class="text-slate-500 text-sm mt-3">Processing document with Gemini API...</p>
            </div>

            <div id="extractedDataBox" class="space-y-4 flex-1">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Name</label>
                    <input type="text" id="fieldName" oninput="updateJsonFromInputs()" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Age</label>
                    <input type="text" id="fieldAge" oninput="updateJsonFromInputs()" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Address</label>
                    <textarea id="fieldAddress" oninput="updateJsonFromInputs()" rows="2" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Phone Number</label>
                    <input type="text" id="fieldPhone" oninput="updateJsonFromInputs()" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Full Extracted Details (JSON Payload)</label>
                    <pre id="rawJsonBox" class="bg-slate-900 text-emerald-400 p-3 rounded-lg text-xs overflow-x-auto max-h-40 font-mono">Upload a document to view JSON output...</pre>
                </div>

                <!-- Save Record Button -->
                <button id="saveBtn" onclick="saveRecord()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition text-sm shadow-sm hidden">
                    💾 Save Corrected JSON Record
                </button>
            </div>
        </div>

        <!-- Right Column: Document Live Preview Box -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col">
            <h2 class="text-lg font-semibold text-slate-800 mb-4 pb-2 border-b border-slate-100">
                Doc Live Preview
            </h2>

            <div class="flex-1 bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl flex items-center justify-center p-4 min-h-[350px]">
                <img id="imagePreview" src="" alt="Uploaded Document" class="hidden max-h-[450px] object-contain rounded-lg shadow-sm">
                <div id="placeholderText" class="text-center text-slate-400">
                    <p class="text-sm">No Document Uploaded Yet.</p>
                    <p class="text-xs mt-1">Click top right button to upload image.</p>
                </div>
            </div>
        </div>

    </main>

    <script>
        function getOrderedJson(data) {
    return {
        "Name": data.Name || data.name || "",
        "Age": data.Age || data.age || "",
        "Address": data.Address || data.address || "",
        "Phone_Number": data.Phone_Number || data.phone_number || "",
        "Document_Type": data.Document_Type || data.document_type || "",
        "Raw_Extracted_Text": data.Raw_Extracted_Text || data.raw_extracted_text || ""
    };
}


        let currentExtractedData = {};

        async function submitUpload() {
            const fileInput = document.getElementById('documentInput');
            if (!fileInput.files || fileInput.files.length === 0) return;

            const formData = new FormData();
            formData.append('document', fileInput.files[0]);

            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('placeholderText').classList.add('hidden');

            try {
                const response = await fetch('/api/process-document', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                document.getElementById('loadingState').classList.add('hidden');

                if (data.status === 'success') {
                    const img = document.getElementById('imagePreview');
                    img.src = data.image_url;
                    img.classList.remove('hidden');

                    currentExtractedData = data.extracted_data;

                    document.getElementById('fieldName').value = currentExtractedData.Name || currentExtractedData.name || '';
                    document.getElementById('fieldAge').value = currentExtractedData.Age || currentExtractedData.age || '';
                    document.getElementById('fieldAddress').value = currentExtractedData.Address || currentExtractedData.address || '';
                    document.getElementById('fieldPhone').value = currentExtractedData.Phone_Number || currentExtractedData.phone_number || currentExtractedData.Phone || currentExtractedData.phone || '';
                    
                   document.getElementById('rawJsonBox').textContent = JSON.stringify(getOrderedJson(currentExtractedData), null, 2)
                    
                    // Button display trigger
                    document.getElementById('saveBtn').classList.remove('hidden');
                } else {
                    alert('Error: ' + data.error);
                }

            } catch (err) {
                document.getElementById('loadingState').classList.add('hidden');
                alert('Execution failed: ' + err.message);
            }
        }

        function updateJsonFromInputs() {
            currentExtractedData.Name = document.getElementById('fieldName').value;
            currentExtractedData.Age = document.getElementById('fieldAge').value;
            currentExtractedData.Address = document.getElementById('fieldAddress').value;
            currentExtractedData.Phone_Number = document.getElementById('fieldPhone').value;

            document.getElementById('rawJsonBox').textContent = JSON.stringify(getOrderedJson(currentExtractedData), null, 2);   
        }

        async function saveRecord() {
            try {
                const response = await fetch('/api/save-document', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentExtractedData)
                });

                const result = await response.json();
                if (result.status === 'success') {
                    alert('Success: ' + result.message);
                } else {
                    alert('Save Failed: ' + result.error);
                }
            } catch (err) {
                alert('Save Error: ' + err.message);
            }
        }
    </script>
</body>
</html>
